name: Python-check

on:
  push:
    branches: [master, 'dev*', 'fix*', 'issue*', 'python*', 'doc*', gh-actions, githubactions]
    paths: ['python/dalex/**', 'tox.ini', '.github/workflows/Python-check.yaml']
  pull_request:
    paths: ['python/dalex/**', 'tox.ini', '.github/workflows/Python-check.yaml']
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Dependency availability for the free-threaded stack is experimental.
    # Its failure remains visible; regular supported matrix entries remain required.
    continue-on-error: ${{ matrix.python == '3.14t' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.14t'
    env:
      PYTHON_GIL: ${{ matrix.python == '3.14t' && '0' || '1' }}
      EXPECT_GIL: ${{ matrix.python == '3.14t' && '0' || '1' }}
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify interpreter build and initial GIL state
        run: python python/dalex/ci/verify_runtime.py --interpreter-only
      - name: Install package and full test dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --only-binary=numpy,pandas,scipy,pyarrow,scikit-learn,statsmodels,polars,polars-runtime-32,matplotlib,scikit-image,shap -e ./python/dalex -r python/dalex/ci/requirements.txt 2>&1 | tee dependency-install.log
          python -m pip freeze > dependency-versions.txt
      - name: Verify interpreter and GIL after dependency imports
        run: python python/dalex/ci/verify_runtime.py
      - name: Run full suite including mandatory pandas and Polars tests
        run: python -m pytest -q -ra python/dalex/test --junitxml=test-results.xml
      - name: Save test and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.python }}-${{ matrix.os }}
          path: |
            test-results.xml
            dependency-versions.txt
            dependency-install.log

  backend-benchmark:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e ./python/dalex polars pyarrow scikit-learn psutil
      - run: python python/dalex/benchmarks/bench_variable_importance_backends.py --sizes 1000 10000 --repetitions 3 --rounds 2
      - run: python python/dalex/benchmarks/bench_variable_importance_backends.py --sizes 1000 10000 --repetitions 3 --rounds 2 --warm-runtime --output-prefix dalex-narwhals-benchmark-warm
      - uses: actions/upload-artifact@v4
        with:
          name: dalex-narwhals-benchmark
          path: dalex-narwhals-benchmark*

  minimum-pandas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -e ./python/dalex numpy==1.24.4 pandas==1.5.3 narwhals==2.0.0 'polars>=1.0' pyarrow pytest
      - run: python -m pytest -q python/dalex/test/test_narwhals_backend.py --junitxml=minimum-pandas.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimum-pandas
          path: minimum-pandas.xml
